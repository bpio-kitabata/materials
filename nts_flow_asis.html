/* ---- SVG flowchart renderer ---- */
const COL = {k:0, n:1, i:2}
const LANE_W = 180
const BOX_H = 44
const BOX_W = 160
const BOX_PAD = 10
const ROW_H = 66
const SVG_W = LANE_W * 3
const LANE_CX = [LANE_W*0+LANE_W/2, LANE_W*1+LANE_W/2, LANE_W*2+LANE_W/2]

function laneColor(lane){
  if(lane==='k') return {fill:C.kFill,stroke:C.kBorder,text:C.kText}
  if(lane==='n') return {fill:C.nFill,stroke:C.nBorder,text:C.nText}
  return {fill:C.iFill,stroke:C.iBorder,text:C.iText}
}

function wrapText(text, maxW){
  const words = text.split('')
  const lines = []
  let line = ''
  const charW = 6.5
  const maxChars = Math.floor(maxW / charW)
  for(let i=0;i<words.length;i++){
    if((line+words[i]).length <= maxChars){
      line += words[i]
    } else {
      if(line) lines.push(line)
      line = words[i]
    }
  }
  if(line) lines.push(line)
  return lines
}

function buildSVG(flow){
  const steps = flow.steps
  const n = steps.length
  const H = n * ROW_H + 20
  let svg = `<svg viewBox="0 0 ${SVG_W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;overflow:visible">`

  // Lane backgrounds
  svg += `<rect x="0" y="0" width="${LANE_W}" height="${H}" fill="#F0F7FF" opacity="0.5"/>`
  svg += `<rect x="${LANE_W}" y="0" width="${LANE_W}" height="${H}" fill="#F0FBF5" opacity="0.5"/>`
  svg += `<rect x="${LANE_W*2}" y="0" width="${LANE_W}" height="${H}" fill="#FFFBF0" opacity="0.5"/>`
  // Lane dividers
  svg += `<line x1="${LANE_W}" y1="0" x2="${LANE_W}" y2="${H}" stroke="#CBD5E1" stroke-width="0.5"/>`
  svg += `<line x1="${LANE_W*2}" y1="0" x2="${LANE_W*2}" y2="${H}" stroke="#CBD5E1" stroke-width="0.5"/>`

  // Compute box center Y for each step
  const cy = steps.map((_,i)=> 16 + i*ROW_H + BOX_H/2)
  const cx = steps.map(s=> LANE_CX[COL[s.lane]])

  // Draw connector lines first (under boxes)
  for(let i=0;i<n-1;i++){
    const x1=cx[i], y1=cy[i], x2=cx[i+1], y2=cy[i+1]
    const by1 = y1 + BOX_H/2  // bottom of current box
    const ty2 = y2 - BOX_H/2  // top of next box

    if(x1===x2){
      // Same lane: straight vertical line
      svg += `<line x1="${x1}" y1="${by1}" x2="${x2}" y2="${ty2}" stroke="${C.line}" stroke-width="1.5"/>`
      svg += arrowHead(x2, ty2, 'down')
    } else {
      // Different lane: elbow connector
      const midY = (by1 + ty2) / 2
      svg += `<polyline points="${x1},${by1} ${x1},${midY} ${x2},${midY} ${x2},${ty2}" fill="none" stroke="${C.line}" stroke-width="1.5" stroke-linejoin="round"/>`
      svg += arrowHead(x2, ty2, 'down')
    }
  }

  // Draw boxes on top
  for(let i=0;i<n;i++){
    const s = steps[i]
    const col = laneColor(s.lane)
    const bx = cx[i] - BOX_W/2
    const by = cy[i] - BOX_H/2

    svg += `<rect x="${bx}" y="${by}" width="${BOX_W}" height="${BOX_H}" rx="5" fill="${col.fill}" stroke="${col.stroke}" stroke-width="1"/>`

    // Label
    const lines = wrapText(s.label, BOX_W - 16)
    const lineH = 13
    const totalH = lines.length * lineH
    const startY = by + (BOX_H - totalH)/2 + lineH * 0.8
    lines.forEach((ln,li)=>{
      svg += `<text x="${cx[i]}" y="${startY + li*lineH}" text-anchor="middle" font-size="10.5" font-family="sans-serif" fill="${col.text}" font-weight="500">${escXml(ln)}</text>`
    })

    // Tool tags below box
    if(s.tools.length>0){
      let tx = cx[i] - (s.tools.length*36)/2
      s.tools.forEach(t=>{
        const tw = t.length*6+10
        tx = Math.max(bx+2, Math.min(bx+BOX_W-tw-2, tx))
        svg += `<rect x="${tx}" y="${by+BOX_H+2}" width="${tw}" height="12" rx="3" fill="${col.stroke}" opacity="0.25"/>`
        svg += `<text x="${tx+tw/2}" y="${by+BOX_H+10}" text-anchor="middle" font-size="9" font-family="sans-serif" fill="${col.text}">${escXml(t)}</text>`
        tx += tw + 4
      })
    }
  }

  svg += '</svg>'
  return svg
}

function arrowHead(x, y, dir){
  if(dir==='down'){
    return `<polygon points="${x},${y} ${x-5},${y-7} ${x+5},${y-7}" fill="${C.arrow}"/>`
  }
  return ''
}

function escXml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

/* Build table rows for a flow */
function buildFlowRow(flow, tbody){
  const svg = buildSVG(flow)
  const n = flow.steps.length
  const H = n * ROW_H + 20

  const tr = document.createElement('tr')
  tr.id = flow.id
  tr.className = 'flow-row'
  tr.style.cssText = 'border-top:0.5px solid var(--color-border-secondary)'

  // gyomu cell
  const gTd = document.createElement('td')
  gTd.className = 'g-cell'
  gTd.innerHTML = `<div class="g-no">${flow.no}</div><div class="g-name">${flow.name}</div><span class="g-freq">${flow.freq}</span>`
  tr.appendChild(gTd)

  // svg spanning 3 cols
  const svgTd = document.createElement('td')
  svgTd.colSpan = 3
  svgTd.style.cssText = 'padding:0;border:none'
  svgTd.innerHTML = svg
  tr.appendChild(svgTd)

  tbody.appendChild(tr)

  // separator
  const sep = document.createElement('tr')
  sep.className = 'flow-sep'
  sep.innerHTML = '<td colspan="4" style="height:1px;padding:0;background:var(--color-border-tertiary)"></td>'
  tbody.appendChild(sep)
}

/* Init tables */
;['a','b','c'].forEach(cat=>{
  const tbody = document.getElementById('tbody-'+cat)
  FLOWS.filter(f=>f.cat===cat).forEach(f=>buildFlowRow(f, tbody))
})

/* ---- Navigation ---- */
let activeCat = null

function buildCatNav(){
  const catRow = document.getElementById('catRow')
  catRow.innerHTML = ''
  Object.entries(CATS).forEach(([cat, info])=>{
    const b = document.createElement('button')
    b.className = 'cat-btn '+cat+(activeCat===cat?' on':'')
    b.textContent = info.label
    b.onclick = ()=>toggleCat(cat)
    b.id = 'cat-'+cat
    catRow.appendChild(b)
  })
}

function buildSubNav(cat){
  const subRow = document.getElementById('subRow')
  subRow.innerHTML = ''
  FLOWS.filter(f=>f.cat===cat).forEach(f=>{
    const b = document.createElement('button')
    b.className = 'sub-btn'
    b.id = 'sub-'+f.id
    b.textContent = f.no+' '+f.name
    b.onclick = ()=>{ document.getElementById(f.id).scrollIntoView({behavior:'smooth',block:'start'}) }
    subRow.appendChild(b)
  })
}

function toggleCat(cat){
  const subWrap = document.getElementById('subWrap')
  if(activeCat===cat){
    activeCat=null
    subWrap.classList.remove('open')
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('on'))
    return
  }
  activeCat=cat
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('on'))
  document.getElementById('cat-'+cat).classList.add('on')
  buildSubNav(cat)
  subWrap.classList.add('open')
}

buildCatNav()

/* ---- Scroll observation per flow row ---- */
const obs = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(!e.isIntersecting) return
    const f = FLOWS.find(x=>x.id===e.target.id)
    if(!f) return

    // Update cat nav
    if(f.cat !== activeCat){
      activeCat = f.cat
      document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('on'))
      const cb = document.getElementById('cat-'+f.cat)
      if(cb) cb.classList.add('on')
      buildSubNav(f.cat)
      document.getElementById('subWrap').classList.add('open')
    }

    // Update sub nav
    document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('on','a','b','c'))
    const sb = document.getElementById('sub-'+f.id)
    if(sb) sb.classList.add('on', f.cat)
  })
}, {threshold:0.05, rootMargin:'-40px 0px -70% 0px'})

FLOWS.forEach(f=>{ const el=document.getElementById(f.id); if(el) obs.observe(el) })
</script>
