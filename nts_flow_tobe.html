<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTS 労務業務フロー（To-Be / Jinjer移行後）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif}
.shell{display:flex;flex-direction:column;height:100vh}
.nav-wrap{flex-shrink:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 16px 8px}
.nav-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-title{font-size:12px;font-weight:600;color:#1e293b}
.tobe-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:#0F6E56;color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px solid #e2e8f0;align-items:center}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:#64748b}
.leg-box{width:28px;height:16px;border-radius:4px;background:#EFF6FF;flex-shrink:0;position:relative}
.leg-box.chg{outline:2.5px solid #BA7517;outline-offset:1px}
.leg-box.del{opacity:0.4}
.leg-box.del::after{content:'';position:absolute;top:50%;left:3px;right:3px;height:1.5px;background:#94a3b8}
.leg-box.add{outline:2.5px solid #3B6D11;outline-offset:1px}
.leg-box.tbd{outline:2.5px solid #7F77DD;outline-offset:1px}
.cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cat-btn{padding:5px 14px;border-radius:99px;border:1.5px solid;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;background:transparent}
.cat-btn.a{border-color:#185FA5;color:#185FA5}.cat-btn.a.on{background:#185FA5;color:#fff}
.cat-btn.b{border-color:#0F6E56;color:#0F6E56}.cat-btn.b.on{background:#0F6E56;color:#fff}
.cat-btn.c{border-color:#854F0B;color:#854F0B}.cat-btn.c.on{background:#854F0B;color:#fff}
.sub-wrap{overflow:hidden;max-height:0;transition:max-height .25s ease}
.sub-wrap.open{max-height:200px;margin-top:6px}
.sub-row{display:flex;gap:4px;flex-wrap:wrap;padding-top:6px;border-top:1px solid #e2e8f0}
.sub-btn{padding:3px 9px;border-radius:99px;border:1px solid #cbd5e1;font-size:11px;cursor:pointer;background:transparent;color:#64748b;transition:all .15s;white-space:nowrap}
.sub-btn:hover{background:#f1f5f9}
.sub-btn.on.a{background:#E6F1FB;border-color:#185FA5;color:#0C447C;font-weight:600}
.sub-btn.on.b{background:#E1F5EE;border-color:#0F6E56;color:#085041;font-weight:600}
.sub-btn.on.c{background:#FAEEDA;border-color:#854F0B;color:#633806;font-weight:600}
.scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.content{padding:12px 16px 60px}
.sec{margin-bottom:24px}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;margin-bottom:10px}
.sec-hdr.a{background:#E6F1FB;border-left:4px solid #185FA5}
.sec-hdr.b{background:#E1F5EE;border-left:4px solid #0F6E56}
.sec-hdr.c{background:#FAEEDA;border-left:4px solid #854F0B}
.sec-ttl{font-size:13px;font-weight:600}
.sec-ttl.a{color:#0C447C}.sec-ttl.b{color:#085041}.sec-ttl.c{color:#633806}
.sec-badge{font-size:11px;padding:2px 8px;border-radius:99px}
.sec-badge.a{background:#B5D4F4;color:#0C447C}
.sec-badge.b{background:#9FE1CB;color:#085041}
.sec-badge.c{background:#FAC775;color:#633806}
.ftbl{width:100%;border-collapse:collapse;table-layout:fixed}
.ftbl th{padding:8px;font-size:11px;font-weight:600;text-align:center;border:1px solid #cbd5e1}
.th-g{background:#f8fafc;color:#64748b;width:96px}
.th-k{background:#185FA5;color:#fff}
.th-n{background:#0F6E56;color:#fff}
.th-i{background:#854F0B;color:#fff}
.ftbl td{border-right:1px solid #cbd5e1;border-left:1px solid #cbd5e1;vertical-align:top;padding:0}
.g-cell{background:#f8fafc;padding:10px 8px;vertical-align:top;border-top:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1}
.g-no{font-size:11px;color:#94a3b8;margin-bottom:3px}
.g-name{font-size:12px;font-weight:600;line-height:1.4;margin-bottom:4px;color:#1e293b}
.g-freq{display:inline-block;font-size:10px;padding:2px 6px;border-radius:99px;background:#f1f5f9;color:#64748b}
.flow-sep td{height:2px;padding:0;background:#e2e8f0}
</style>
</head>
<body>
<div class="shell">
  <div class="nav-wrap">
    <div class="nav-top">
      <span class="nav-title">NTS 労務業務フロー</span>
      <span class="tobe-badge">To-Be / Jinjer移行後</span>
    </div>
    <div class="legend">
      <div class="leg"><div class="leg-box chg"></div>変更</div>
      <div class="leg"><div class="leg-box del"></div>廃止（参考）</div>
      <div class="leg"><div class="leg-box add"></div>新規追加</div>
      <div class="leg"><div class="leg-box tbd"></div>要確認</div>
      <div class="leg"><div class="leg-box"></div>変わらず</div>
    </div>
    <div class="cat-row" id="catRow"></div>
    <div class="sub-wrap" id="subWrap"><div class="sub-row" id="subRow"></div></div>
  </div>
  <div class="scroller" id="scroller">
    <div class="content">
      <div id="sa" class="sec" data-cat="a">
        <div class="sec-hdr a"><span class="sec-ttl a">従業員情報管理</span><span class="sec-badge a">① 〜 ⑤</span></div>
        <table class="ftbl"><thead><tr><th class="th-g">業務</th><th class="th-k">BPIO</th><th class="th-n">NTS担当者</th><th class="th-i">IHIBS担当者</th></tr></thead><tbody id="tbody-a"></tbody></table>
      </div>
      <div id="sb" class="sec" data-cat="b">
        <div class="sec-hdr b"><span class="sec-ttl b">勤怠・給与計算</span><span class="sec-badge b">⑥ 〜 ⑯</span></div>
        <table class="ftbl"><thead><tr><th class="th-g">業務</th><th class="th-k">BPIO</th><th class="th-n">NTS担当者</th><th class="th-i">IHIBS担当者</th></tr></thead><tbody id="tbody-b"></tbody></table>
      </div>
      <div id="sc" class="sec" data-cat="c">
        <div class="sec-hdr c"><span class="sec-ttl c">有期雇用管理</span><span class="sec-badge c">⑰ 〜 ⑲</span></div>
        <table class="ftbl"><thead><tr><th class="th-g">業務</th><th class="th-k">BPIO</th><th class="th-n">NTS担当者</th><th class="th-i">IHIBS担当者</th></tr></thead><tbody id="tbody-c"></tbody></table>
      </div>
    </div>
  </div>
</div>
<script>
const C={kFill:'#EFF6FF',kBorder:'#93C5FD',kText:'#1E40AF',nFill:'#F0FDF4',nBorder:'#86EFAC',nText:'#166534',iFill:'#FFFBEB',iBorder:'#FCD34D',iText:'#92400E',line:'#94A3B8',arrow:'#64748B'}
const OV={
  keep:{os:null,ow:0,badge:null,dim:1,strike:false},
  chg: {os:'#BA7517',ow:2.5,badge:{t:'変',bg:'#FAEEDA',c:'#633806'},dim:1,strike:false},
  add: {os:'#3B6D11',ow:2.5,badge:{t:'新',bg:'#C0DD97',c:'#173404'},dim:1,strike:false},
  del: {os:null,ow:0,badge:{t:'廃',bg:'#f1f5f9',c:'#94a3b8'},dim:0.38,strike:true},
  tbd: {os:'#7F77DD',ow:2.5,badge:{t:'確',bg:'#CECBF6',c:'#26215C'},dim:1,strike:false},
}
const LW=180,BH=44,BW=160,RH=68,SW=LW*3
const LCX=[LW/2,LW+LW/2,LW*2+LW/2]
const COL={k:0,n:1,i:2}
const CATS={a:{label:'従業員情報管理'},b:{label:'勤怠・給与計算'},c:{label:'有期雇用管理'}}

// 資料原本通りに完全再構築
// lane: k=BPIO, n=NTS担当者, i=IHIBS担当者
// diff: keep/chg/add/del/tbd
const FLOWS=[
  // ① 入社登録
  // To-Be: 5ステップ (資料通り)
  // Step1: 受領連絡 / BPIO・業務統括室 / メール・入社処理・書類配布 / 変更（要確認→移行）
  // Step2: 書類確認・ファイル移動 / BPIO / 入社処理 / 移行
  // Step3: チェックリスト準備 / 業務統括室 / Excel / 現状維持
  // Step4: jinjerへ従業員情報登録 / BPIO / jinjer人事労務 / 移行
  // Step5: 登録完了連絡 / BPIO・業務統括室 / メール / 現状維持
  {id:'g01',no:'①',name:'入社登録',freq:'随時',cat:'a',steps:[
    {lane:'k',label:'受領連絡',tools:['メール','jinjer入社処理','書類配布'],diff:'chg'},
    {lane:'k',label:'書類確認・ファイル移動',tools:['jinjer入社処理'],diff:'chg'},
    {lane:'k',label:'チェックリスト準備',tools:['Excel'],diff:'keep'},
    {lane:'k',label:'jinjerへ従業員情報登録',tools:['jinjer人事労務'],diff:'chg'},
    {lane:'k',label:'登録完了連絡',tools:['メール'],diff:'keep'},
    {lane:'n',label:'完了報告を受領',tools:[],diff:'keep'},
  ]},

  // ② 退職登録
  // To-Be: 1ステップのみ (資料通り)
  // As Step1(受領連絡): 廃止
  // As Step2(退職情報登録) → To-Be Step1: 退職者がjinjer WFで申請 / 担当:退職者
  // As Step3(完了連絡): 廃止
  {id:'g02',no:'②',name:'退職登録',freq:'随時',cat:'a',steps:[
    {lane:'k',label:'受領連絡',tools:['メール'],diff:'del'},
    {lane:'n',label:'退職申請をJinjer WFで申請',tools:['jinjer WF'],diff:'chg'},
    {lane:'k',label:'登録完了連絡',tools:['メール'],diff:'del'},
  ]},

  // ③ 正社員登用
  // To-Be: 3ステップ (資料通り)
  // Step1: jinjerWF申請 / 担当:業務統括室（熊本）担当者=BPIO / jinjerWF / 移行
  //   ※備考「NTS担当者よりjinjerWFで申請」→NTSが申請しBPIOが確認受信
  // Step2: 従業員情報変更登録 / BPIO / jinjer人事労務 / 移行
  // Step3: 登録完了連絡 / BPIO / メール / 現状維持
  {id:'g03',no:'③',name:'正社員登用',freq:'随時',cat:'a',steps:[
    {lane:'n',label:'jinjer WFで申請',tools:['jinjer WF'],diff:'chg'},
    {lane:'k',label:'jinjer WF申請の確認受信',tools:['jinjer WF'],diff:'chg'},
    {lane:'k',label:'従業員情報変更登録',tools:['jinjer人事労務'],diff:'chg'},
    {lane:'k',label:'登録完了連絡',tools:['メール'],diff:'keep'},
    {lane:'n',label:'完了報告を受領',tools:[],diff:'keep'},
  ]},

  // ④ 組織改訂
  // To-Be: 6ステップ (資料通り)
  // As Step3(データ送付→IHIBS): 廃止
  // As Step4(取込結果受領): 廃止
  // As Step7(所属変更データ送付): 廃止
  // As Step8(取込結果受領2回目): 廃止
  // To-Be Step1: 組織改訂資料受領 / 業務統括室 / メール・共有フォルダ / 現状維持
  // To-Be Step2: 組織変更データ作成 / 業務統括室 / jinjer人事労務 / 移行
  // To-Be Step3: 結果内容確認依頼 / 業務統括室・BPIO / jinjer人事労務 / 移行(As5)
  // To-Be Step4: 従業員所属等変更データ作成 / BPIO / jinjer人事労務 / 移行(As6)
  // To-Be Step5: 結果内容確認依頼(2回目) / BPIO / jinjer人事労務 / 移行(As9)
  // To-Be Step6: 作業完了報告 / 業務統括室 / メール / 現状維持(As10)
  {id:'g04',no:'④',name:'組織改訂',freq:'随時・年度末',cat:'a',steps:[
    {lane:'n',label:'組織図・部門コード等を送付',tools:['メール'],diff:'keep'},
    {lane:'k',label:'組織改訂資料受領',tools:['メール','共有フォルダ'],diff:'keep'},
    {lane:'k',label:'組織変更データ作成',tools:['jinjer人事労務'],diff:'chg'},
    {lane:'k',label:'結果内容確認依頼',tools:['jinjer人事労務'],diff:'chg'},
    {lane:'k',label:'従業員所属等変更データ作成・取込',tools:['jinjer人事労務'],diff:'chg'},
    {lane:'k',label:'結果内容確認依頼（2回目）',tools:['jinjer人事労務'],diff:'chg'},
    {lane:'k',label:'作業完了報告',tools:['メール'],diff:'keep'},
    {lane:'n',label:'完了報告を受領',tools:[],diff:'keep'},
  ]},

  // ⑤ その他変更
  // To-Be: 3ステップ (資料通り)
  // Step1: jinjerWFにて申請 / 申請者本人(NTSレーンではなくn扱い) / jinjerWF / 移行
  // Step2: 情報変更登録 / 業務統括室・BPIO / jinjerWF・人事労務 / 移行
  // Step3: 登録完了連絡 / 業務統括室 / jinjerWF・メール / 移行
  {id:'g05',no:'⑤',name:'その他変更',freq:'随時',cat:'a',steps:[
    {lane:'n',label:'申請者本人がjinjer WFで申請',tools:['jinjer WF'],diff:'chg'},
    {lane:'k',label:'情報変更登録',tools:['jinjer WF','jinjer人事労務'],diff:'chg'},
    {lane:'k',label:'登録完了連絡',tools:['jinjer WF','メール'],diff:'chg'},
    {lane:'n',label:'完了報告を受領（WF回覧）',tools:[],diff:'chg'},
  ]},

  // ⑥ 勤怠計算
  // To-Be: 3ステップ (資料通り) + 廃止6ステップを参考表示
  // Step1(As1): 賃金日程確認 / 業務統括室・BPIO / メール / 現状維持（送付元BPIO）
  // Step1(As2): 勤怠投入状況確認 / 業務統括室 / Jinjer勤怠 / 移行
  // Step2(As3): 未入力者への督促 / 業務統括室 / メール / 現状維持
  // As Step4〜9: 廃止
  {id:'g06',no:'⑥',name:'勤怠計算',freq:'月次',cat:'b',steps:[
    {lane:'k',label:'賃金日程確認',tools:['メール'],diff:'keep'},
    {lane:'k',label:'勤怠投入状況確認',tools:['Jinjer勤怠'],diff:'chg'},
    {lane:'k',label:'未入力者への督促',tools:['メール'],diff:'keep'},
    {lane:'n',label:'督促受領・勤怠を投入',tools:[],diff:'keep'},
    {lane:'k',label:'給与データ出力',tools:['iS-Time','Excel'],diff:'del'},
    {lane:'k',label:'給与データ確認・修正',tools:['Excel','NET-J'],diff:'del'},
    {lane:'k',label:'勤怠計算依頼・データ送付',tools:['メール'],diff:'del'},
    {lane:'k',label:'計算結果確認',tools:['Excel'],diff:'del'},
    {lane:'k',label:'時間外データ作成・送付',tools:['Excel','メール'],diff:'del'},
  ]},

  // ⑦ 交通費データ作成
  // To-Be: 3ステップ (資料通り) + 廃止2ステップ参考表示
  // Step1(As1): 賃金予定表受領 / 業務統括室・BPIO / メール / 現状維持
  // Step1(As2): 交通費申請 / 申請者本人 / jinjerWF / 移行（BPIOではなく本人）
  // Step2(As3): 定期券代確認 / 業務統括室 / Yahoo乗換・ジョルダン / 現状維持
  // Step3(As4): ガソリン代確認 / 申請者本人 / jinjerWF / 移行（本人申請→BPIO確認）
  // As Step5〜6: 廃止
  {id:'g07',no:'⑦',name:'交通費データ作成',freq:'月次',cat:'b',steps:[
    {lane:'k',label:'賃金予定表受領',tools:['メール'],diff:'keep'},
    {lane:'n',label:'交通費申請（本人がWFで申請）',tools:['jinjer WF'],diff:'chg'},
    {lane:'k',label:'定期券代確認',tools:['Yahoo乗換','ジョルダン'],diff:'keep'},
    {lane:'n',label:'ガソリン代申請（本人がWFで申請）',tools:['jinjer WF'],diff:'chg'},
    {lane:'k',label:'ガソリン代確認（申請金額の確認）',tools:['jinjer WF'],diff:'chg'},
    {lane:'k',label:'支給控除データ作成',tools:['Excel投入表'],diff:'del'},
    {lane:'k',label:'支給控除データ送付',tools:['メール'],diff:'del'},
  ]},

  // ⑧ その他支給控除
  // To-Be: 2ステップ (資料通り) + 廃止1ステップ参考表示
  // Step1(As1): 賃金予定表受領 / 業務統括室 / メール / 現状維持
  // Step1(As2): 給与関連データ受領 / 業務統括室 / メール・共有フォルダ / 現状維持
  //   ※As3(データ確認・精査)はStep2に統合 → 廃止扱い
  // Step2(As4): 支給控除データ反映 / BPIO / Jinjer給与 / 移行
  // As Step5: 廃止
  {id:'g08',no:'⑧',name:'その他支給控除',freq:'月次',cat:'b',steps:[
    {lane:'k',label:'賃金予定表受領',tools:['メール'],diff:'keep'},
    {lane:'n',label:'財形・融資・社宅等のデータを送付',tools:['メール'],diff:'keep'},
    {lane:'k',label:'給与関連データ受領・確認',tools:['メール','共有フォルダ'],diff:'keep'},
    {lane:'k',label:'支給控除データ反映',tools:['Jinjer給与'],diff:'chg'},
    {lane:'k',label:'支給控除データ送付',tools:['メール'],diff:'del'},
  ]},

  // ⑨ 月次給与計算
  // To-Be: 4ステップ (資料通り) + 廃止2ステップ参考表示
  // As Step1(計算結果確認支給控除): 廃止
  // As Step2(NET-J修正登録): 廃止
  // Step1(As3): 賃金計算 / BPIO / Jinjer給与 / 移行
  // Step2(As5): 賃金計算結果確認 / BPIO / Jinjer給与 / 移行
  // Step3(As6): 賃金再計算 / BPIO / Jinjer給与 / 移行
  // Step4(新規): 給与データ締め / BPIO / Jinjer給与 / 追加
  {id:'g09',no:'⑨',name:'月次給与計算',freq:'月次',cat:'b',steps:[
    {lane:'k',label:'計算結果確認（支給控除）',tools:['メール','Excel'],diff:'del'},
    {lane:'k',label:'NET-J修正登録',tools:['NET-J'],diff:'del'},
    {lane:'k',label:'賃金計算',tools:['Jinjer給与'],diff:'chg'},
    {lane:'k',label:'賃金計算結果確認',tools:['Jinjer給与'],diff:'chg'},
    {lane:'k',label:'賃金再計算（必要時）',tools:['Jinjer給与'],diff:'chg'},
    {lane:'k',label:'給与データ締め処理',tools:['Jinjer給与'],diff:'add'},
  ]},

  // ⑩ 給与後処理①
  // To-Be: 2ステップ (資料通り) + 廃止1ステップ参考表示
  // Step1(As1): 再計算結果受領→給与データ出力 / BPIO / Jinjer給与 / 移行
  // Step2(As2): 各部署用書類作成 / 業務統括室 / Excel / 現状維持
  // As Step3(賃金明細出力依頼→IHIBS): 廃止
  {id:'g10',no:'⑩',name:'給与後処理①各部署書類',freq:'月次',cat:'b',steps:[
    {lane:'k',label:'給与データを出力',tools:['Jinjer給与'],diff:'chg'},
    {lane:'k',label:'各部署用書類作成',tools:['Excel'],diff:'keep'},
    {lane:'k',label:'賃金明細出力依頼',tools:['メール'],diff:'del'},

function lc(l){return l==='k'?{fill:C.kFill,stroke:C.kBorder,text:C.kText}:l==='n'?{fill:C.nFill,stroke:C.nBorder,text:C.nText}:{fill:C.iFill,stroke:C.iBorder,text:C.iText}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function wrap(t,mw){const mc=Math.floor(mw/6.5),w=t.split(''),lines=[];let ln='';for(const c of w){if((ln+c).length<=mc){ln+=c}else{if(ln)lines.push(ln);ln=c}}if(ln)lines.push(ln);return lines}

function buildSVG(flow){
  const s=flow.steps,n=s.length,H=n*RH+24
  let svg=`<svg viewBox="0 0 ${SW} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%">`
  svg+=`<rect x="0" y="0" width="${LW}" height="${H}" fill="#EFF6FF" opacity="0.4"/>`
  svg+=`<rect x="${LW}" y="0" width="${LW}" height="${H}" fill="#F0FDF4" opacity="0.4"/>`
  svg+=`<rect x="${LW*2}" y="0" width="${LW}" height="${H}" fill="#FFFBEB" opacity="0.4"/>`
  svg+=`<line x1="${LW}" y1="0" x2="${LW}" y2="${H}" stroke="#CBD5E1" stroke-width="0.5"/>`
  svg+=`<line x1="${LW*2}" y1="0" x2="${LW*2}" y2="${H}" stroke="#CBD5E1" stroke-width="0.5"/>`
  const cy=s.map((_,i)=>16+i*RH+BH/2)
  const cx=s.map(st=>LCX[COL[st.lane]])
  // connectors
  for(let i=0;i<n-1;i++){
    const bd=s[i].diff==='del'&&s[i+1].diff==='del'
    const op=bd?0.25:1,lc2=bd?'#cbd5e1':C.line
    const x1=cx[i],y1=cy[i]+BH/2,x2=cx[i+1],y2=cy[i+1]-BH/2
    if(x1===x2){svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lc2}" stroke-width="1.5" opacity="${op}"/>`}
    else{const m=(y1+y2)/2;svg+=`<polyline points="${x1},${y1} ${x1},${m} ${x2},${m} ${x2},${y2}" fill="none" stroke="${lc2}" stroke-width="1.5" stroke-linejoin="round" opacity="${op}"/>`}
    const ac=bd?'#cbd5e1':C.arrow
    svg+=`<polygon points="${x2},${y2} ${x2-5},${y2-7} ${x2+5},${y2-7}" fill="${ac}" opacity="${op}"/>`
  }
  // boxes + overlays
  for(let i=0;i<n;i++){
    const st=s[i],col=lc(st.lane),ov=OV[st.diff]
    const bx=cx[i]-BW/2,by=cy[i]-BH/2
    // base box (lane colors intact = As-Is同じ)
    svg+=`<rect x="${bx}" y="${by}" width="${BW}" height="${BH}" rx="5" fill="${col.fill}" stroke="${col.stroke}" stroke-width="1" opacity="${ov.dim}"/>`
    // outer glow border overlay
    if(ov.os){svg+=`<rect x="${bx-2}" y="${by-2}" width="${BW+4}" height="${BH+4}" rx="7" fill="none" stroke="${ov.os}" stroke-width="${ov.ow}" opacity="0.9"/>`}
    // dim mask for 廃止
    if(st.diff==='del'){svg+=`<rect x="${bx}" y="${by}" width="${BW}" height="${BH}" rx="5" fill="#f8fafc" opacity="0.55"/>`}
    // badge (right-top, outside box)
    if(ov.badge){
      const bw=22,bh=13,bx2=bx+BW-bw,by2=by-bh/2-2
      svg+=`<rect x="${bx2}" y="${by2}" width="${bw}" height="${bh}" rx="3" fill="${ov.badge.bg}" stroke="${ov.os||'#cbd5e1'}" stroke-width="0.5"/>`
      svg+=`<text x="${bx2+bw/2}" y="${by2+9}" text-anchor="middle" font-size="9" font-family="sans-serif" fill="${ov.badge.c}" font-weight="700">${ov.badge.t}</text>`
    }
    // label
    const lines=wrap(st.label,BW-14),lh=13,th=lines.length*lh,sy=by+(BH-th)/2+lh*0.85
    lines.forEach((ln,li)=>{svg+=`<text x="${cx[i]}" y="${sy+li*lh}" text-anchor="middle" font-size="10.5" font-family="sans-serif" fill="${col.text}" font-weight="600" opacity="${ov.dim}">${esc(ln)}</text>`})
    // strikethrough
    if(st.diff==='del'){const m=by+BH/2;svg+=`<line x1="${bx+8}" y1="${m}" x2="${bx+BW-8}" y2="${m}" stroke="#94a3b8" stroke-width="1.5"/>`}
    // tool tags (非廃止のみ)
    if(st.tools.length&&st.diff!=='del'){
      let tx=cx[i]-(st.tools.reduce((a,t)=>a+t.length*6+12,0)+st.tools.length*3)/2
      st.tools.forEach(t=>{
        const tw=t.length*6+10;tx=Math.max(bx+2,tx)
        const isJ=t.toLowerCase().includes('jinjer')
        svg+=`<rect x="${tx}" y="${by+BH+2}" width="${tw}" height="12" rx="3" fill="${isJ?'#9FE1CB':'#e2e8f0'}"/>`
        svg+=`<text x="${tx+tw/2}" y="${by+BH+10}" text-anchor="middle" font-size="9" font-family="sans-serif" fill="${isJ?'#085041':'#475569'}">${esc(t)}</text>`
        tx+=tw+4
      })
    }
  }
  svg+='</svg>';return svg
}

function addFlowRow(flow,tbody){
  const tr=document.createElement('tr');tr.id=flow.id;tr.style.borderTop='1px solid #cbd5e1'
  const g=document.createElement('td');g.className='g-cell'
  g.innerHTML=`<div class="g-no">${flow.no}</div><div class="g-name">${flow.name}</div><span class="g-freq">${flow.freq}</span>`
  tr.appendChild(g)
  const sd=document.createElement('td');sd.colSpan=3;sd.style.cssText='padding:0;border:none'
  sd.innerHTML=buildSVG(flow);tr.appendChild(sd);tbody.appendChild(tr)
  const sep=document.createElement('tr');sep.className='flow-sep';sep.innerHTML='<td colspan="4"></td>';tbody.appendChild(sep)
}
;['a','b','c'].forEach(cat=>FLOWS.filter(f=>f.cat===cat).forEach(f=>addFlowRow(f,document.getElementById('tbody-'+cat))))

let activeCat=null
function buildCatRow(){
  const row=document.getElementById('catRow');row.innerHTML=''
  Object.entries(CATS).forEach(([cat,info])=>{
    const b=document.createElement('button');b.className='cat-btn '+cat+(activeCat===cat?' on':'')
    b.id='cat-'+cat;b.textContent=info.label;b.onclick=()=>toggleCat(cat);row.appendChild(b)
  })
}
function buildSubRow(cat){
  const row=document.getElementById('subRow');row.innerHTML=''
  FLOWS.filter(f=>f.cat===cat).forEach(f=>{
    const b=document.createElement('button');b.className='sub-btn';b.id='sub-'+f.id
    b.textContent=f.no+' '+f.name;b.onclick=()=>jumpTo(f.id);row.appendChild(b)
  })
}
function jumpTo(id){
  const scroller=document.getElementById('scroller'),target=document.getElementById(id)
  if(!target||!scroller) return
  let offset=0,el=target
  while(el&&el!==scroller){offset+=el.offsetTop;el=el.offsetParent}
  scroller.scrollTo({top:offset,behavior:'smooth'})
}
function toggleCat(cat){
  const wrap=document.getElementById('subWrap')
  if(activeCat===cat){activeCat=null;wrap.classList.remove('open');document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('on'));return}
  activeCat=cat;buildCatRow();buildSubRow(cat);wrap.classList.add('open')
}
buildCatRow()
const scroller=document.getElementById('scroller')
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(!e.isIntersecting) return
    const f=FLOWS.find(x=>x.id===e.target.id);if(!f) return
    if(f.cat!==activeCat){activeCat=f.cat;buildCatRow();buildSubRow(f.cat);document.getElementById('subWrap').classList.add('open')}
    document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('on','a','b','c'))
    const sb=document.getElementById('sub-'+f.id);if(sb) sb.classList.add('on',f.cat)
  })
},{root:scroller,threshold:0.05,rootMargin:'-40px 0px -70% 0px'})
FLOWS.forEach(f=>{const el=document.getElementById(f.id);if(el) obs.observe(el)})
