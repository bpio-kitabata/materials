function lc(l){return l==='k'?{fill:C.kFill,stroke:C.kBorder,text:C.kText}:l==='n'?{fill:C.nFill,stroke:C.nBorder,text:C.nText}:{fill:C.iFill,stroke:C.iBorder,text:C.iText}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function wrap(t,mw){
  const mc=Math.floor(mw/6.5),words=t.split(''),lines=[],c=6.5
  let ln=''
  for(const w of words){if((ln+w).length<=mc){ln+=w}else{if(ln)lines.push(ln);ln=w}}
  if(ln)lines.push(ln)
  return lines
}
function arrow(x,y){return `<polygon points="${x},${y} ${x-5},${y-7} ${x+5},${y-7}" fill="${C.arrow}"/>`}

function buildSVG(flow){
  const s=flow.steps,n=s.length,H=n*ROW_H+24
  let svg=`<svg viewBox="0 0 ${SVG_W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%">`
  svg+=`<rect x="0" y="0" width="${LANE_W}" height="${H}" fill="#EFF6FF" opacity="0.4"/>`
  svg+=`<rect x="${LANE_W}" y="0" width="${LANE_W}" height="${H}" fill="#F0FDF4" opacity="0.4"/>`
  svg+=`<rect x="${LANE_W*2}" y="0" width="${LANE_W}" height="${H}" fill="#FFFBEB" opacity="0.4"/>`
  svg+=`<line x1="${LANE_W}" y1="0" x2="${LANE_W}" y2="${H}" stroke="#CBD5E1" stroke-width="0.5"/>`
  svg+=`<line x1="${LANE_W*2}" y1="0" x2="${LANE_W*2}" y2="${H}" stroke="#CBD5E1" stroke-width="0.5"/>`

  const cy=s.map((_,i)=>16+i*ROW_H+BOX_H/2)
  const cx=s.map(st=>LANE_CX[COL[st.lane]])

  for(let i=0;i<n-1;i++){
    const x1=cx[i],y1=cy[i]+BOX_H/2,x2=cx[i+1],y2=cy[i+1]-BOX_H/2
    if(x1===x2){
      svg+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.line}" stroke-width="1.5"/>`
    } else {
      const mid=(y1+y2)/2
      svg+=`<polyline points="${x1},${y1} ${x1},${mid} ${x2},${mid} ${x2},${y2}" fill="none" stroke="${C.line}" stroke-width="1.5" stroke-linejoin="round"/>`
    }
    svg+=arrow(x2,y2)
  }

  for(let i=0;i<n;i++){
    const st=s[i],col=lc(st.lane)
    const bx=cx[i]-BOX_W/2,by=cy[i]-BOX_H/2
    svg+=`<rect x="${bx}" y="${by}" width="${BOX_W}" height="${BOX_H}" rx="5" fill="${col.fill}" stroke="${col.stroke}" stroke-width="1"/>`
    const lines=wrap(st.label,BOX_W-14),lh=13,th=lines.length*lh
    const sy=by+(BOX_H-th)/2+lh*0.85
    lines.forEach((ln,li)=>{
      svg+=`<text x="${cx[i]}" y="${sy+li*lh}" text-anchor="middle" font-size="10.5" font-family="sans-serif" fill="${col.text}" font-weight="500">${esc(ln)}</text>`
    })
    if(st.tools.length){
      let tx=cx[i]-(st.tools.reduce((a,t)=>a+t.length*6+12,0)+st.tools.length*3)/2
      st.tools.forEach(t=>{
        const tw=t.length*6+10
        tx=Math.max(bx+2,tx)
        svg+=`<rect x="${tx}" y="${by+BOX_H+2}" width="${tw}" height="12" rx="3" fill="${col.stroke}" opacity="0.3"/>`
        svg+=`<text x="${tx+tw/2}" y="${by+BOX_H+10}" text-anchor="middle" font-size="9" font-family="sans-serif" fill="${col.text}">${esc(t)}</text>`
        tx+=tw+4
      })
    }
  }
  svg+='</svg>'
  return svg
}

function addFlowRow(flow,tbody){
  const tr=document.createElement('tr')
  tr.id=flow.id
  tr.style.cssText='border-top:0.5px solid var(--color-border-secondary)'
  const g=document.createElement('td')
  g.className='g-cell'
  g.innerHTML=`<div class="g-no">${flow.no}</div><div class="g-name">${flow.name}</div><span class="g-freq">${flow.freq}</span>`
  tr.appendChild(g)
  const sd=document.createElement('td')
  sd.colSpan=3
  sd.style.cssText='padding:0;border:none'
  sd.innerHTML=buildSVG(flow)
  tr.appendChild(sd)
  tbody.appendChild(tr)
  const sep=document.createElement('tr')
  sep.className='flow-sep'
  sep.innerHTML='<td colspan="4"></td>'
  tbody.appendChild(sep)
}

;['a','b','c'].forEach(cat=>{
  FLOWS.filter(f=>f.cat===cat).forEach(f=>addFlowRow(f,document.getElementById('tbody-'+cat)))
})

/* ---- Nav ---- */
let activeCat=null

function buildCatRow(){
  const row=document.getElementById('catRow')
  row.innerHTML=''
  Object.entries(CATS).forEach(([cat,info])=>{
    const b=document.createElement('button')
    b.className='cat-btn '+cat+(activeCat===cat?' on':'')
    b.id='cat-'+cat
    b.textContent=info.label
    b.onclick=()=>toggleCat(cat)
    row.appendChild(b)
  })
}

function buildSubRow(cat){
  const row=document.getElementById('subRow')
  row.innerHTML=''
  FLOWS.filter(f=>f.cat===cat).forEach(f=>{
    const b=document.createElement('button')
    b.className='sub-btn'
    b.id='sub-'+f.id
    b.textContent=f.no+' '+f.name
    b.onclick=()=>scrollTo(f.id)
    row.appendChild(b)
  })
}

function scrollTo(id){
  const el=document.getElementById(id)
  if(!el) return
  const navH=document.getElementById('navWrap').offsetHeight
  const top=el.getBoundingClientRect().top+window.scrollY-navH-4
  window.scrollTo({top,behavior:'smooth'})
}

function toggleCat(cat){
  const wrap=document.getElementById('subWrap')
  if(activeCat===cat){
    activeCat=null
    wrap.classList.remove('open')
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('on'))
    return
  }
  activeCat=cat
  buildCatRow()
  buildSubRow(cat)
  wrap.classList.add('open')
}

buildCatRow()

/* ---- Scroll sync ---- */
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(!e.isIntersecting) return
    const f=FLOWS.find(x=>x.id===e.target.id)
    if(!f) return
    if(f.cat!==activeCat){
      activeCat=f.cat
      buildCatRow()
      buildSubRow(f.cat)
      document.getElementById('subWrap').classList.add('open')
    }
    document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('on','a','b','c'))
    const sb=document.getElementById('sub-'+f.id)
    if(sb) sb.classList.add('on',f.cat)
  })
},{threshold:0.05,rootMargin:'-40px 0px -70% 0px'})

FLOWS.forEach(f=>{const el=document.getElementById(f.id);if(el)obs.observe(el)})
</script>
